<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f6f7fb" media="(prefers-color-scheme: light)">
  <title>Tracd</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="/" aria-label="Tracd home">
        <img src="/static/icon.svg" alt="" width="30" height="30">
        <span><b>Tracd</b></span>
      </a>
      <div id="pulse" class="pulse-chip" aria-live="polite"></div>
      <button id="open-settings" class="btn ghost" type="button">
        <svg class="i"><use href="#i-bell"/></svg><span>Phone alerts</span><i id="settings-dot" class="dot" hidden></i>
      </button>
    </div>
  </header>

  <main class="wrap">
    <div id="banner"></div>

    <section class="add card" aria-labelledby="add-title">
      <h1 id="add-title">Get pinged the second your size is back.</h1>
      <p class="sub">Paste a product link, pick your size, and Tracd checks the shop every few seconds.</p>
      <form id="add-form" class="add-form" autocomplete="off">
        <label class="sr" for="link">Product link</label>
        <div class="field">
          <svg class="i"><use href="#i-link"/></svg>
          <input id="link" name="link" type="text" inputmode="url" placeholder="Paste a link from Flipkart, Myntra, AJIO, Amazon, Tata CLiQ or Nykaa" required>
          <button id="paste-btn" class="btn ghost small" type="button" hidden>Paste</button>
        </div>
        <button class="btn primary" type="submit" id="find-btn"><span>Find sizes</span></button>
      </form>
      <ul class="shops" id="shop-list" aria-label="Supported shops"></ul>
      <div id="picker" class="picker" hidden></div>
    </section>

    <section class="watches" aria-labelledby="watches-title">
      <div class="section-head">
        <h2 id="watches-title">Your watches</h2>
        <div class="tabs" role="tablist" id="filters"></div>
      </div>
      <div id="watch-list" class="watch-list"></div>
    </section>

    <section class="activity card" aria-labelledby="activity-title">
      <details id="activity">
        <summary><h2 id="activity-title">Activity</h2><span class="muted" id="activity-count"></span></summary>
        <ol id="log" class="log"></ol>
      </details>
    </section>

    <footer class="foot muted">
      <span>Runs on this computer. Never logs in, never buys, never gets around a shop's verification page.</span>
      <span id="version"></span>
    </footer>
  </main>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-backdrop" data-close></div>
    <aside class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet-head">
        <h2 id="sheet-title">Phone alerts</h2>
        <button class="btn icon ghost" type="button" data-close aria-label="Close"><svg class="i"><use href="#i-x"/></svg></button>
      </div>
      <div id="sheet-body" class="sheet-body"></div>
    </aside>
  </div>

  <div id="modal" class="modal" hidden></div>
  <div id="toasts" class="toasts" aria-live="assertive"></div>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.07 0l3-3a5 5 0 0 0-7.07-7.07l-1.5 1.5"/><path d="M14 11a5 5 0 0 0-7.07 0l-3 3a5 5 0 0 0 7.07 7.07l1.5-1.5"/></symbol>
      <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36L21 8"/><path d="M21 3v5h-5"/></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="m6 3 14 9-14 9z"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></symbol>
      <symbol id="i-ext" viewBox="0 0 24 24"><path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
      <symbol id="i-history" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l4 2"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
      <symbol id="i-window" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/></symbol>
      <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></symbol>
      <symbol id="i-phone" viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M11 18h2"/></symbol>
      <symbol id="i-send" viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/></symbol>
      <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M5.6 18.4l2.8-2.8M15.6 8.4l2.8-2.8"/></symbol>
    </defs>
  </svg>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
