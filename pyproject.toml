[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tracd"
version = "1.0.0"
description = "Never miss a restock again: instant phone alerts the moment your size is back in stock."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "playwright>=1.40",
    "aiohttp>=3.9",
    "segno>=1.5",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-aiohttp>=1.0", "pytest-asyncio>=0.23"]

[project.scripts]
tracd = "tracd.cli:main"

[tool.setuptools]
packages = ["tracd", "tracd.shops"]

[tool.setuptools.package-data]
tracd = ["web/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
